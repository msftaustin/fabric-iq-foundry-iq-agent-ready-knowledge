          {
            title: "The enterprise knowledge problem",
            body: "<p>Useful context is split across documents, search indexes, business data, workplace content, and the web.</p><div class=\"ct-callout\">People should not need to know which system holds the answer before they can ask the question.</div>",

          {
            title: "Add current web context",

          {
            title: "Bring in structured business meaning",

            title: "Respect the user's work context",
